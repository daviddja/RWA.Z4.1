<!DOCTYPE html>
<html lang="hr">
<head>
 <meta charset="UTF-8" />
 <title>Brojevi</title>
</head>
<body>
 <script type="text/javascript">
    let i = 1;
    for(i = 1; i < 100; i=(i+2)) {
        document.write("Broj: " + i + "<br>");
        document.write("Kvadrat broja: " + (i * i) + "<br>");
    }
 </script>
</body>
</html>
