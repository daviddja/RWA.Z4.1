<!DOCTYPE html>
<html lang="hr">
<head>
 <meta charset="UTF-8" />
 <title>Funckijska osobina</title>
</head>
<body>
 <script type="text/javascript">
    let Pas = {
        ime: 'Rex',
        age: 2
    };

    Pas.Zvuk = function() {
        return "AV AV!";
    };

    document.write("Ime: " + Pas.ime + "<br>");
    document.write("Godine: " + Pas.age + "<br>");
    document.write("Zvuk: " + Pas.Zvuk() + "<br>");
 </script>
</body>
</html>
